calibration_required_for_each_work_pose:
  - furniture identity and edge direction in the map
  - arm mounting side and preferred working direction
  - measured base-to-object horizontal reach
  - table or sofa height and collision clearance
  - final RGB-D visual correction target
  - live Gemini depth confirmation before close approach
  - fail-closed stop on missing, stale, invalid, or inconsistent depth
  - allow the intended furniture only through a validated task-facing exclusion sector; keep side and rear clearance fail-closed
arm_task_intent:
  extension_direction: forward
  arm_side: both
  preferred_execution_arm: right
  demonstration_arm: left
  demonstration_method: realtime_relative_leader_follower
  leader_board: black
  follower_board: white
  implementation: tools/black_leads_white_wrap_safe.py
  learning_intent: demonstration_data_collection_training_and_autonomous_execution
  table_tasks: [pick, place]
  sofa_tasks: [place]
planned_navigation_sequence:
  status: requires_segment_by_segment_supervised_validation
  ordered_pose_ids:
    - right_c.work_pose
    - right_c.predock_pose
    - right_a.predock_pose
    - right_a.work_pose
  safety_notes:
    - fold both arms into the safe transit pose before any base motion
    - independently localize and verify three wheel stop readbacks after every segment
    - keep both work poses disabled as direct navigation goals until their approach and exit segments pass
  improved_runtime_mode_20260905:
    status: enabled
    standard_gemini_pose_required_for_base_motion: true
    first_localization_duration_s: 60
    subsequent_visual_health_window_s: 30
    retain_trusted_wheel_pose_between_route_legs: true
    localization_continuity_gate:
      max_position_error_m: 0.25
      max_yaw_error_deg: 25.0
      action_on_failure: reject_planning_and_motion
    route_confirmation_policy: one_user_route_authorization_then_automatic_legs
    parking_policy: three_wheel_readbacks_after_each_motion
    emergency_stop: physical_12v_cutoff_or_scripts/jetson_home_navigation_stop.sh
    continuous_leg_limits:
      max_planned_path_m: 3.00
      max_tracked_travel_m: 3.25
      max_runtime_s: 180
      max_linear_mps: 0.04
      max_angular_deg_s: 12
    work_pose_arrival_mode:
      mode: align_goal_yaw_then_holonomic_translate
      same_workspace_predock_work_bidirectional: true
      exact_goal: true
      dock_entry_distance_m: 0.50
      reason: avoid unnecessary path-heading rotation on short forward/reverse furniture approaches
