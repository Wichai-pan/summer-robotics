# Stable shared mapping for the robot's Jetson execution host.

project:
  name: ForestBridge summer-robotics
  local_repo_root: /Users/huataipan/Wichai/Hackathons/summer-robotics

git_sync:
  remote_name: origin
  default_branch: main
  strategy: github

servers:
  - name: xlerobot-jetson
    ssh_alias: jetsonl7
    remote_repo_root: /home/jetsonl7/summer-robotics-deploy
    scheduler: none
    launch_modes:
      - ssh
      - tmux
    env_activation: docker run --rm --runtime nvidia forestbridge-xlerobot:jp62
    default_env: forestbridge-xlerobot:jp62
    data_root: /home/jetsonl7/robot-data
    checkpoint_root: /home/jetsonl7/robot-data/checkpoints
    scratch_root: /home/jetsonl7/robot-data/tmp
    logs_root: /home/jetsonl7/robot-data/logs
    notes:
      - Host is an NVIDIA Jetson Orin Nano Super running Ubuntu 22.04 / L4T 36.4.4.
      - The deployment clone exists and currently tracks origin/main.
      - NVIDIA NGC PyTorch 25.06 py3 iGPU is the baseline; do not replace its torch with a generic PyPI wheel.
      - Add the Linux aarch64 Orbbec SDK to the derived image after the GPU and LeRobot smoke test passes.

policies:
  code_runs_on_jetson_for_robot_hardware: true
  git_remote_is_source_of_truth: true
  require_clean_git_before_sync: true
  require_git_sync_before_server_run: true
  require_physical_operator_for_motion: true
  require_exclusive_hardware_lock_for_motion: true
  forbid_concurrent_motor_control: true
  forbid_destructive_git_on_server_without_confirmation: true
  prefer_remote_cmd_for_simple_server_commands: true
  prefer_remote_bash_for_complex_server_shell_logic: true

environment_policy:
  python_env_strategy: versioned-jetson-igpu-container
  environments:
    - forestbridge-xlerobot:jp62
  notes:
    - Preserve NVIDIA's system CUDA and TensorRT packages.
    - Base image is nvcr.io/nvidia/pytorch:25.06-py3-igpu with Python 3.12 and NVIDIA's Jetson GPU torch.
    - Install vendored LeRobot with --no-deps after its non-torch dependencies so pip cannot replace NVIDIA torch.
    - The host owns Docker, udev rules, device permissions, and hardware locks; robot Python packages live in the image.
    - Linux USB access must use groups/udev rules, not recurring chmod 666 or sudo camera runs.
